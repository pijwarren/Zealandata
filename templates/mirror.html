<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Zealandata Output Mirror</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    /* The canvas's offsetParent, which is what calibration_preview.js
       positions the axis labels against -- so this has to establish a
       containing block even though it fills the window. */
    /* Rotated 180 rather than flipped -- whatever's viewing this tab
       (a second screen propped up next to the print) is mounted the
       opposite way up from a normal monitor. A pure CSS transform, applied
       after layout: it rotates the canvas's painted pixels together with
       the axis labels calibration_preview.js positions on top of it (both
       are descendants of this div, so they rotate as one rigid unit and
       stay aligned), without calibration_preview.js needing to know
       anything changed. Safe at exactly 180 -- rotating a non-square
       fixed-to-viewport rect by 180 degrees maps it exactly back onto
       itself; 90/270 would need the width/height swapped too to avoid
       clipping, which this doesn't. */
    #stage {
      position: fixed;
      inset: 0;
      transform: rotate(180deg);
    }
    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }
    /* calibration_preview.js positions these itself (left/top/opacity),
       so they only need to be absolutely positioned and coloured here. */
    .axis-label {
      position: absolute; top: 0; left: 0; z-index: 1;
      transform: translate(-50%, -50%);
      font-size: 13px; font-weight: 700;
      font-family: -apple-system, system-ui, sans-serif;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      pointer-events: none; opacity: 0;
    }
    .axis-label--x { color: #ff4d4d; }
    .axis-label--y { color: #4dff4d; }
    .axis-label--z { color: #598cff; }
    #status {
      position: absolute; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      color: #9aa0a6;
      font: 500 16px/1.4 -apple-system, system-ui, sans-serif;
      text-align: center; padding: 24px;
      background: rgba(0, 0, 0, 0.55);
    }
    #stage canvas {
      /* Otherwise a touch drag on the canvas also tries to scroll/zoom the
         page, which fights the orbit drag below on touchscreens. */
      touch-action: none;
      cursor: grab;
    }
    #stage canvas.dragging { cursor: grabbing; }
    /* A sibling of #stage, not a child -- unlike the axis labels, this is
       chrome for whoever's actually driving this tab (the admin panel's
       "Open output preview" button opens it in an ordinary browser), not
       something that needs to read right-side-up on the physically
       upside-down second screen #stage's own 180-degree rotate is for. A
       child would rotate (and reposition) along with the canvas instead of
       staying put where a normal button belongs. */
    #resetView {
      position: fixed; z-index: 3;
      bottom: 16px; right: 16px;
      padding: 8px 14px;
      font: 600 13px/1 -apple-system, system-ui, sans-serif;
      color: #e8eaed;
      background: rgba(32, 33, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      cursor: pointer;
    }
    #resetView:hover { background: rgba(48, 49, 52, 0.9); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="mirrorCanvas" width="1280" height="720"></canvas>
    <span class="axis-label axis-label--x" id="labelX">X</span>
    <span class="axis-label axis-label--y" id="labelY">Y</span>
    <span class="axis-label axis-label--z" id="labelZ">Z</span>
    <div id="status">Loading the projection model&hellip;</div>
  </div>
  <button id="resetView" type="button" title="Reset to the calibrated view">Reset view</button>
  <script type="module">
    // Renders the projector's output client-side, through
    // static/calibration_preview.js -- itself a line-for-line port of
    // projector.c. The admin panel's "Open output preview" button opens
    // this page; it used to drive the same module in a floating overlay
    // instead. This page used to poll a JPEG of the Pi's real
    // framebuffer instead, which cost the projector a full 1080p
    // glReadPixels every 0.3s plus an ffmpeg encode per poll -- measured
    // at ~16% of its frame rate, and paid whether or not anyone had this
    // page open. Doing the drawing on the viewing device instead costs the
    // Pi nothing but the small mapping poll below.
    //
    // The tradeoff, worth being honest about: this is a reconstruction
    // rather than a photograph of the output, so it's only ever as accurate
    // as the port stays, and it textures the model with a still poster
    // frame of whatever was playing when the page loaded (see
    // api_current_frame in server.py) -- captured once, not a live video
    // feed, and not refreshed if something else starts playing afterward.
    // That suits what this is for -- checking alignment while calibrating.
    import * as preview from "/static/calibration_preview.js";

    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("mirrorCanvas");
    const resetViewBtn = document.getElementById("resetView");
    const labels = {
      x: document.getElementById("labelX"),
      y: document.getElementById("labelY"),
      z: document.getElementById("labelZ"),
    };

    // Mouse/touch orbit plus scroll/pinch zoom, purely a local viewing aid --
    // see calibration_preview.js's orbitBy/zoomBy/resetOrbit for why none of
    // this ever touches the actual calibration mapping. Radians per CSS
    // pixel of drag; the canvas is rotated 180deg with the rest of #stage,
    // so a drag's raw movementX/Y already point the "wrong" way from the
    // pointer's own on-screen perspective and both are negated to match.
    const ORBIT_RADIANS_PER_PX = 0.008;
    // e^(-deltaY * this) so a normal mouse-wheel notch (~100) and a slow
    // trackpad scroll both feel proportional rather than the same fixed
    // step regardless of how hard the wheel was spun.
    const WHEEL_ZOOM_SPEED = 0.0025;

    // One-finger drag orbits; two-finger pinch zooms -- tracked through the
    // same pointer stream since both can be in progress across the same
    // gesture (e.g. lifting one finger of a pinch back to a single drag).
    const activePointers = new Map(); // pointerId -> {x, y}
    let dragging = false;
    let pinchStartDist = null;

    function pinchDistance() {
      const pts = [...activePointers.values()];
      return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }

    canvas.addEventListener("pointerdown", (event) => {
      if (!preview.isReady()) return;
      canvas.setPointerCapture(event.pointerId);
      activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (activePointers.size === 2) {
        dragging = false;
        canvas.classList.remove("dragging");
        pinchStartDist = pinchDistance();
      } else if (activePointers.size === 1) {
        dragging = true;
        canvas.classList.add("dragging");
      }
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!activePointers.has(event.pointerId)) return;
      activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (activePointers.size >= 2) {
        const dist = pinchDistance();
        if (pinchStartDist) preview.zoomBy(dist / pinchStartDist);
        pinchStartDist = dist;
        return;
      }
      if (!dragging) return;
      preview.orbitBy(
        -event.movementX * ORBIT_RADIANS_PER_PX,
        -event.movementY * ORBIT_RADIANS_PER_PX
      );
    });
    function endDrag(event) {
      activePointers.delete(event.pointerId);
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      pinchStartDist = activePointers.size >= 2 ? pinchDistance() : null;
      dragging = activePointers.size === 1;
      canvas.classList.toggle("dragging", dragging);
    }
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    // Mouse-wheel and trackpad scroll/pinch (browsers report a trackpad
    // pinch as a wheel event with ctrlKey set) -- touch pinch is handled
    // above through pointer events instead, since touchscreens don't fire
    // wheel events at all.
    canvas.addEventListener("wheel", (event) => {
      if (!preview.isReady()) return;
      event.preventDefault();
      preview.zoomBy(Math.exp(-event.deltaY * WHEEL_ZOOM_SPEED));
    }, { passive: false });

    resetViewBtn.addEventListener("click", () => preview.resetOrbit());

    // Matches the admin panel's own calibration poll. The payload is a
    // small flat JSON object and the client is on the same LAN, so this is
    // orders of magnitude cheaper than the snapshot feed it replaces.
    //
    // The poll is the fallback path, and what makes this page work when
    // it's opened on its own. While the admin panel is driving, its slider
    // values arrive over the BroadcastChannel below instead, which is
    // immediate rather than up to a poll behind.
    const POLL_MS = 400;
    // How long a pushed update keeps the poll from overwriting it. The
    // panel debounces its save, so for a moment after a drag the server
    // still holds the previous value -- without this, a poll landing in
    // that window would yank the view back to it and the mirror would
    // visibly stutter against the slider.
    const PUSH_AUTHORITY_MS = 1200;
    let lastSerialised = null;
    let currentMapping = null;
    let lastPushAt = 0;

    async function fetchMapping() {
      const r = await fetch("/api/mapping", { cache: "no-store" });
      if (!r.ok) throw new Error("mapping unavailable (" + r.status + ")");
      return r.json();
    }

    // Re-render only when something actually changed: the module draws on
    // demand rather than in a rAF loop, so an unchanged poll should cost
    // the viewing device nothing either.
    function apply(mapping) {
      const serialised = JSON.stringify(mapping);
      if (serialised === lastSerialised) return;
      lastSerialised = serialised;
      currentMapping = mapping;
      preview.requestRender(mapping);
    }

    // Live slider values pushed straight from the admin panel -- same
    // origin, same browser, no server in the middle. Merged over the last
    // polled mapping rather than used alone, since the panel only sends
    // the fields it has controls for and the renderer reads more than
    // that.
    if (typeof BroadcastChannel !== "undefined") {
      const channel = new BroadcastChannel("zealandata-mapping");
      channel.onmessage = (event) => {
        if (!event.data || !preview.isReady()) return;
        lastPushAt = Date.now();
        apply({ ...(currentMapping || {}), ...event.data });
      };
    }

    async function poll() {
      try {
        const mapping = await fetchMapping();
        if (!preview.isReady()) {
          await preview.init(canvas, labels, statusEl, mapping);
          lastSerialised = JSON.stringify(mapping);
          currentMapping = mapping;
        } else if (Date.now() - lastPushAt > PUSH_AUTHORITY_MS) {
          // Merged rather than swapped wholesale: the server mapping has no
          // notion of which corner is currently selected (that's admin-panel
          // UI state, never persisted), so a plain replace would blank out
          // the corner glow about a second after every broadcast even
          // though the operator hasn't changed the selection at all.
          apply({ ...(currentMapping || {}), ...mapping });
        }
        // init() clears the status itself on success; this covers
        // recovering from a failed poll after we were already running.
        if (preview.isReady()) statusEl.classList.add("hidden");
      } catch (err) {
        statusEl.textContent = "Waiting for the server… (" + err.message + ")";
        statusEl.classList.remove("hidden");
      }
      setTimeout(poll, POLL_MS);
    }

    poll();
  </script>
</body>
</html>
