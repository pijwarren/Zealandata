<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Zealandata Projection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    /* Deliberately in a corner and small: this sits on top of the real
       projected image, so it has to be readable when you're looking for
       it without competing with the content when you aren't. The dark
       plate behind it is what keeps it legible over a bright frame. */
    #fpsCounter {
      position: fixed;
      top: 12px;
      right: 14px;
      padding: 4px 9px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.62);
      color: #6ee7a8;
      font: 600 15px/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.02em;
      pointer-events: none;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="fpsCounter" class="hidden">-- fps</div>
  <video id="sourceVideo" playsinline crossorigin="anonymous" style="display:none"></video>
  <script type="module" src="/static/projection.js"></script>
</body>
</html>
