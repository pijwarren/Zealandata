<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zealandata</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar" id="topbar">
  <div class="topbar__title"><span class="topbar__dot"></span>Zealandata</div>
  <div class="topbar__controls">
    <button type="button" class="tag tag-outline" id="screensaverTag" title="Toggle idle screensaver">Screensaver off</button>
    <button type="button" class="btn-icon" id="startScreensaverBtn" aria-label="Start screensaver now" title="Start screensaver now">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
    </button>
    <button type="button" class="btn-icon" id="settingsBtn" aria-label="Settings" title="Settings">
      <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Zm88-29.84c0-1.44,0-2.88-.09-4.32l14.92-18.64a8,8,0,0,0,1.48-7.06,107.21,107.21,0,0,0-10.88-26.19,8,8,0,0,0-6-3.93l-23.72-2.64c-1-1-2-2-3-3L186,40.54a8,8,0,0,0-3.94-6,107.71,107.71,0,0,0-26.19-10.87,8,8,0,0,0-7.06,1.49L130.16,40q-2.16-.09-4.32,0L107.2,25.16a8,8,0,0,0-7.06-1.48A107.6,107.6,0,0,0,73.95,34.55a8,8,0,0,0-3.93,6L67.38,64.27c-1,1-2,2-3,3L40.54,70a8,8,0,0,0-6,3.94,107.71,107.71,0,0,0-10.87,26.19,8,8,0,0,0,1.49,7.06L40,125.84c0,1.44,0,2.88,0,4.32L25.16,148.8a8,8,0,0,0-1.48,7.06,107.21,107.21,0,0,0,10.88,26.19,8,8,0,0,0,6,3.93l23.72,2.64c1,1,2,2,3,3L70,215.46a8,8,0,0,0,3.94,6,107.71,107.71,0,0,0,26.19,10.87,8,8,0,0,0,7.06-1.49L125.84,216c1.44.06,2.88.06,4.32,0l18.64,14.92a8,8,0,0,0,7.06,1.48,107.21,107.21,0,0,0,26.19-10.88,8,8,0,0,0,3.93-6l2.64-23.72c1-1,2-2,3-3L215.46,186a8,8,0,0,0,6-3.94,107.71,107.71,0,0,0,10.87-26.19,8,8,0,0,0-1.49-7.06Z"></path></svg>
    </button>
  </div>
</header>

<div class="hero hidden" id="heroSection">
  <img class="hero__bg" id="heroImg" alt="" />
  <div class="hero__scrim"></div>
  <div class="hero__content">
    <span class="tag tag-outline" id="heroCategory"></span>
    <h1 id="heroTitle"></h1>
    <p id="heroDesc"></p>
    <button type="button" class="btn btn-primary" id="heroPlayBtn">
      <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"></path></svg>
      Play
    </button>
  </div>
</div>

<main id="browseMain">
  <div id="empty" class="empty hidden">
    <p>No films on the reel.</p>
    <p class="empty__sub">Drop video files into the media folder, then Rescan from Settings.</p>
  </div>

  <div class="category-nav" id="categoryNav"></div>

  <section class="row hidden" id="continueRow" aria-label="Continue watching">
    <h2 class="row__heading">Continue Watching</h2>
    <div class="row__scroller" id="continueGrid"></div>
  </section>

  <div id="categoryRows"></div>
</main>

<div class="scrim hidden" id="settingsScrim"></div>
<div class="drawer hidden" id="settingsDrawer" aria-label="Settings">
  <div class="drawer__header">
    <h2>Settings</h2>
    <button type="button" class="btn-icon" id="settingsCloseBtn" aria-label="Close settings">
      <svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg>
    </button>
  </div>

  <div class="field">
    <label>Library</label>
    <button type="button" class="btn btn-secondary btn-block" id="rescanBtn">Rescan library</button>
  </div>

  <div class="field">
    <label>Admin mode</label>
    <button type="button" class="btn btn-secondary btn-block" id="adminModeBtn">Unlock admin mode</button>
    <p class="field__hint">PIN-protected — lets you rename videos, set the hero banner, and upload new files.</p>
  </div>

  <div class="field hidden" id="uploadField">
    <label>Upload video</label>
    <select class="select-block" id="uploadCategorySelect">
      <option value="">Uncategorized</option>
      <option value="__new__">+ New category…</option>
    </select>
    <input type="text" id="uploadNewCategory" class="hidden" placeholder="New category name" maxlength="60">
    <input type="file" id="uploadInput" accept=".mp4,.mkv,.avi,.mov,.m4v,.webm,.ts" class="hidden">
    <button type="button" class="btn btn-secondary btn-block" id="uploadChooseBtn">Choose file…</button>
    <input type="file" id="uploadAttachmentsInput" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp" multiple class="hidden">
    <button type="button" class="btn btn-secondary btn-block hidden" id="uploadAttachmentsChooseBtn">Add supplementary files (optional)</button>
    <button type="button" class="btn btn-primary btn-block hidden" id="uploadBtn">Upload</button>
    <p class="field__hint" id="uploadStatus"></p>
  </div>
</div>

<div class="scrim hidden" id="pinScrim"></div>
<div class="pinpad hidden" id="pinModal" role="dialog" aria-modal="true" aria-label="Enter admin PIN">
  <div class="pinpad__title" id="pinTitle">Enter Admin PIN</div>
  <div class="pinpad__dots" id="pinDots">
    <span class="pinpad__dot"></span>
    <span class="pinpad__dot"></span>
    <span class="pinpad__dot"></span>
    <span class="pinpad__dot"></span>
  </div>
  <p class="pinpad__error hidden" id="pinError">Incorrect PIN</p>
  <div class="pinpad__grid">
    <button type="button" class="pinpad__key" data-digit="1">1</button>
    <button type="button" class="pinpad__key" data-digit="2">2</button>
    <button type="button" class="pinpad__key" data-digit="3">3</button>
    <button type="button" class="pinpad__key" data-digit="4">4</button>
    <button type="button" class="pinpad__key" data-digit="5">5</button>
    <button type="button" class="pinpad__key" data-digit="6">6</button>
    <button type="button" class="pinpad__key" data-digit="7">7</button>
    <button type="button" class="pinpad__key" data-digit="8">8</button>
    <button type="button" class="pinpad__key" data-digit="9">9</button>
    <button type="button" class="pinpad__key pinpad__key--ghost" id="pinCancelBtn">Cancel</button>
    <button type="button" class="pinpad__key" data-digit="0">0</button>
    <button type="button" class="pinpad__key pinpad__key--ghost" id="pinBackBtn" aria-label="Backspace">⌫</button>
  </div>
</div>

<div class="scrim hidden" id="docScrim"></div>
<div class="doc-viewer hidden" id="docViewer" role="dialog" aria-modal="true" aria-label="Document viewer">
  <button type="button" class="btn-icon doc-viewer__close" id="docViewerClose" aria-label="Close">
    <svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg>
  </button>
  <button type="button" class="btn-icon doc-viewer__nav doc-viewer__nav--prev" id="docViewerPrev" aria-label="Previous document">
    <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg>
  </button>
  <button type="button" class="btn-icon doc-viewer__nav doc-viewer__nav--next" id="docViewerNext" aria-label="Next document">
    <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>
  </button>
  <div class="doc-viewer__content" id="docViewerContent"></div>
  <div class="doc-viewer__counter hidden" id="docViewerCounter"></div>
</div>

<div class="dock-wrap" id="dockWrap">
  <div class="dock__docs" id="dockDocs"></div>
  <div class="dock" id="dock">
  <div class="dock__preview hidden" id="dockPreviewWrap">
    <img id="dockPreview" alt="" />
  </div>
  <div class="dock__title" id="playerTitle">Nothing playing</div>
  <div class="dock__time hidden" id="playerScrubControls">
    <span id="playerPos">0:00</span>
    <div class="dock__bar" id="scrubBar">
      <div class="dock__bar-track">
        <div class="dock__bar-fill" id="scrubFill"></div>
        <div class="dock__bar-handle" id="scrubHandle"></div>
      </div>
    </div>
    <span id="playerDur">0:00</span>
  </div>
  <div class="dock__frame-counter hidden" id="frameCounter">Frame — of —</div>
  <div class="dock__controls">
    <button type="button" class="btn btn-primary btn-icon" id="pauseBtn" aria-label="Play or pause" disabled>
      <svg id="iconPlay" class="hidden" width="17" height="17" viewBox="0 0 256 256" fill="currentColor"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"></path></svg>
      <svg id="iconPause" width="17" height="17" viewBox="0 0 256 256" fill="currentColor"><path d="M216,48H160a16,16,0,0,0-16,16V192a16,16,0,0,0,16,16h56a16,16,0,0,0,16-16V64A16,16,0,0,0,216,48ZM96,48H40A16,16,0,0,0,24,64V192a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V64A16,16,0,0,0,96,48Z"></path></svg>
    </button>
    <button type="button" class="btn-icon dock__stop" id="playerStopBtn" aria-label="Stop" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
    </button>
    <button type="button" class="btn-icon btn-icon-text" id="seekBackBtn" aria-label="Previous frame" title="Previous frame" disabled>−1</button>
    <button type="button" class="btn-icon btn-icon-text" id="seekFwdBtn" aria-label="Next frame" title="Next frame" disabled>+1</button>
    <button type="button" class="btn-icon" id="loopBtn" aria-label="Loop video" title="Loop video" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
    </button>
    <button type="button" class="btn-icon" id="setHeroBtn" aria-label="Set as hero video" title="Set as hero video" disabled>★</button>
  </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
