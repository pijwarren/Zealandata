<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zealandata</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__title">Zealandata</div>
  <div class="topbar__controls">
    <div class="output-toggle" id="outputToggle" role="group" aria-label="Video output">
      <button class="output-toggle__btn" data-mode="hdmi" id="outputHdmiBtn">HDMI</button>
      <button class="output-toggle__btn" data-mode="ndi" id="outputNdiBtn">
        NDI
        <span class="output-toggle__warn hidden" id="outputNdiWarn" title="NDI-enabled ffmpeg build not found on the Pi — check ZEALANDATA_NDI_FFMPEG"></span>
      </button>
    </div>
    <button class="rescan-btn" id="rescanBtn" title="Rescan media folder">Rescan</button>
  </div>
</header>

<main>
  <div id="empty" class="empty hidden">
    <p>No films on the reel.</p>
    <p class="empty__sub">Drop video files into the media folder, then hit Rescan.</p>
  </div>

  <section class="row hidden" id="continueRow" aria-label="Continue watching">
    <h2 class="row__heading">Continue Watching</h2>
    <div class="row__scroller" id="continueGrid"></div>
  </section>

  <div id="categoryRows"></div>
</main>

<div class="dock hidden" id="dock">
  <div class="dock__preview" id="dockPreviewWrap">
    <img id="dockPreview" alt="Live preview of what's currently showing" />
  </div>
  <div class="dock__info">
    <div class="dock__title-row">
      <div class="dock__title" id="dockTitle">—</div>
      <span class="dock__ndi hidden" id="dockNdiBadge">● NDI</span>
    </div>
    <div class="dock__time" id="dockTime">
      <span id="dockPos">0:00</span>
      <div class="dock__bar" id="dockBar">
        <div class="dock__bar-track">
          <div class="dock__bar-fill" id="dockBarFill"></div>
          <div class="dock__bar-handle" id="dockBarHandle"></div>
        </div>
      </div>
      <span id="dockDur">0:00</span>
    </div>
    <div class="dock__frame-counter hidden" id="dockFrameCounter">Frame — of —</div>
    <p class="dock__description hidden" id="dockDescription"></p>
  </div>
  <div class="dock__controls">
    <button id="btnSeekBack" title="Back 10s">«</button>
    <button id="btnFrameBack" class="hidden" title="Previous frame">❮</button>
    <button id="btnPause" title="Play / Pause">❚❚</button>
    <button id="btnFrameFwd" class="hidden" title="Next frame">❯</button>
    <button id="btnSeekFwd" title="Forward 10s">»</button>
    <button id="btnStop" class="btnStop" title="Stop">■</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
