<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zealandata — preview</title>
<style>
:root{
  --bg:        #000000;
  --panel:     #1c1c1e;
  --panel-2:   #2c2c2e;
  --ink:       #ffffff;
  --ink-dim:   #98989d;
  --accent:    #0a84ff;
  --danger:    #ff453a;
  --radius:    16px;
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family: -apple-system, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:22px 40px;
  position:sticky; top:0; z-index:10;
  background:linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
}
.topbar__title{ font-size:19px; font-weight:600; letter-spacing:-0.2px; color:var(--ink); }
.topbar__controls{ display:flex; align-items:center; gap:14px; }

.preview-banner{
  font-size:11px;
  color:var(--ink-dim);
  background:var(--panel);
  border:1px solid rgba(255,255,255,0.08);
  padding:5px 12px;
  border-radius:980px;
}

.output-toggle{
  display:flex;
  background:var(--panel);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:980px;
  padding:3px;
  gap:2px;
}
.output-toggle__btn{
  position:relative;
  border:none;
  background:transparent;
  color:var(--ink-dim);
  font-size:12px;
  font-weight:600;
  letter-spacing:.2px;
  padding:6px 16px;
  border-radius:980px;
  cursor:pointer;
  transition:background .15s, color .15s;
}
.output-toggle__btn:hover{ color:var(--ink); }
.output-toggle__btn.active{ background:var(--accent); color:#ffffff; }
.output-toggle__warn{
  position:absolute; top:2px; right:2px;
  width:6px; height:6px; border-radius:50%;
  background:var(--danger);
}

.rescan-btn{
  background:var(--panel);
  border:1px solid rgba(255,255,255,0.08);
  color:var(--ink-dim);
  padding:8px 16px;
  border-radius:980px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:border-color .15s, color .15s, background .15s;
}
.rescan-btn:hover{ border-color:rgba(255,255,255,0.18); color:var(--ink); background:var(--panel-2); }
.rescan-btn:focus-visible, button:focus-visible, .card:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}

main{ padding:6px 40px 150px; }

.row__heading{
  font-size:13px; font-weight:600; letter-spacing:.2px;
  text-transform:uppercase; color:var(--ink-dim);
  margin:32px 2px 16px;
}

.row__scroller{
  display:flex; gap:20px; overflow-x:auto;
  padding:4px 2px 12px; scrollbar-width:thin;
}
.row__scroller .card{ flex:0 0 210px; }

.row__viewport{ position:relative; }
.row__arrow{
  position:absolute; top:50%; transform:translateY(-50%);
  width:36px; height:36px; border-radius:50%;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.14);
  color:var(--ink); font-size:18px; line-height:1;
  cursor:pointer; z-index:3;
  display:flex; align-items:center; justify-content:center;
  opacity:0;
  transition:opacity .15s ease, background .15s ease;
}
.row__viewport:hover .row__arrow:not(.hidden),
.row__arrow:focus-visible{ opacity:1; }
.row__arrow:hover{ background:rgba(10,132,255,0.5); }
.row__arrow--left{ left:-6px; }
.row__arrow--right{ right:-6px; }
.row__arrow.hidden{ display:none; }

.card{
  cursor:pointer;
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--panel);
  position:relative;
  aspect-ratio: 2 / 3;
  transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease;
}
.card__frame{ position:relative; width:100%; height:100%; }
.card:hover, .card:focus-visible{
  transform:scale(1.07);
  box-shadow:0 24px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.12);
  z-index:2;
}
.card:focus-visible{ outline:none; box-shadow:0 24px 40px rgba(0,0,0,0.55), 0 0 0 2px var(--accent); }

.card__thumb{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; display:block; background:var(--panel-2);
}
.card__scrim{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,0) 46%, rgba(0,0,0,0.88) 100%);
  pointer-events:none;
}
.card__play{
  position:absolute; top:50%; left:50%;
  width:44px; height:44px;
  transform:translate(-50%,-50%) scale(0.85);
  border-radius:50%;
  background:rgba(255,255,255,0.14);
  backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.25);
  display:flex; align-items:center; justify-content:center;
  color:var(--ink); font-size:15px; opacity:0;
  transition:opacity .15s ease, transform .15s ease;
  pointer-events:none;
}
.card:hover .card__play, .card:focus-visible .card__play{
  opacity:1; transform:translate(-50%,-50%) scale(1);
}
.card__title{
  position:absolute; left:14px; right:14px; bottom:14px;
  font-size:13px; font-weight:500; line-height:1.3; color:var(--ink);
}
.card__resume-badge{
  position:absolute; top:10px; right:10px;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(4px);
  color:var(--ink); font-size:10px; font-weight:500; letter-spacing:.2px;
  padding:4px 8px; border-radius:980px; pointer-events:none;
}
.card__restart{
  position:absolute; top:10px; left:10px;
  width:28px; height:28px; border-radius:50%;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(4px);
  color:var(--ink); font-size:13px; line-height:1;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  opacity:0;
  transition:opacity .15s, border-color .15s, background .15s;
}
.card:hover .card__restart, .card:focus-within .card__restart{ opacity:1; }
.card__restart:hover{ border-color:var(--accent); background:rgba(10,132,255,0.25); }
.card__progress{
  position:absolute; left:0; right:0; bottom:0;
  height:3px; background:rgba(255,255,255,0.15); z-index:1;
}
.card__progress-fill{ height:100%; background:var(--accent); }

.hidden{ display:none !important; }

.dock{
  position:fixed; left:50%; bottom:20px;
  transform:translateX(-50%);
  width:min(760px, calc(100% - 32px));
  display:flex; align-items:center; gap:20px;
  padding:14px 22px;
  background:rgba(28,28,30,0.72);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);
}
.dock__info{ flex:1; min-width:0; }
.dock__title-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.dock__title{
  font-size:14px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dock__ndi{
  flex-shrink:0;
  font-size:10px; font-weight:600; letter-spacing:.3px;
  color:var(--accent);
  background:rgba(10,132,255,0.15);
  border:1px solid rgba(10,132,255,0.35);
  padding:2px 7px; border-radius:980px;
}
.dock__time{ display:flex; align-items:center; gap:12px; font-size:11px; color:var(--ink-dim); font-variant-numeric:tabular-nums; }
.dock__bar{ flex:1; height:16px; display:flex; align-items:center; cursor:pointer; touch-action:none; }
.dock__bar-track{ position:relative; width:100%; height:4px; background:rgba(255,255,255,0.15); border-radius:2px; overflow:visible; }
.dock__bar-fill{ height:100%; width:0%; background:var(--ink); border-radius:2px; }
.dock__bar-handle{
  position:absolute; top:50%; left:0%;
  width:13px; height:13px; border-radius:50%;
  background:var(--ink);
  transform:translate(-50%,-50%);
  box-shadow:0 1px 4px rgba(0,0,0,0.4);
}
.dock__controls{ display:flex; gap:8px; }
.dock__controls button{
  width:38px; height:38px; border-radius:50%; border:none;
  background:rgba(255,255,255,0.1); color:var(--ink);
  cursor:pointer; font-size:13px;
  transition:background .15s, color .15s;
}
.dock__controls button:hover{ background:rgba(10,132,255,0.35); color:var(--ink); }
.dock__controls .btnStop:hover{ background:rgba(255,69,58,0.3); color:#ff8a80; }

@media (max-width:640px){
  .topbar{ padding:16px 18px; }
  main{ padding:6px 18px 160px; }
  .dock{ left:10px; right:10px; bottom:10px; transform:none; width:auto; padding:12px 16px; gap:12px; }
  .row__scroller .card{ flex-basis:150px; }
  .row__arrow{ display:none !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__title">Zealandata</div>
  <div class="topbar__controls">
    <div class="preview-banner">Preview — mock data, no Pi connected</div>
    <div class="output-toggle" id="outputToggle" role="group" aria-label="Video output">
      <button class="output-toggle__btn active" data-mode="hdmi" id="outputHdmiBtn">HDMI</button>
      <button class="output-toggle__btn" data-mode="ndi" id="outputNdiBtn">NDI</button>
    </div>
    <button class="rescan-btn" id="rescanBtn">Rescan</button>
  </div>
</header>

<main>
  <section class="row hidden" id="continueRow">
    <h2 class="row__heading">Continue Watching</h2>
    <div class="row__scroller" id="continueGrid"></div>
  </section>
  <div id="categoryRows"></div>
</main>

<div class="dock hidden" id="dock">
  <div class="dock__info">
    <div class="dock__title-row">
      <div class="dock__title" id="dockTitle">—</div>
      <span class="dock__ndi hidden" id="dockNdiBadge">● NDI</span>
    </div>
    <div class="dock__time">
      <span id="dockPos">0:00</span>
      <div class="dock__bar" id="dockBar">
        <div class="dock__bar-track">
          <div class="dock__bar-fill" id="dockBarFill"></div>
          <div class="dock__bar-handle" id="dockBarHandle"></div>
        </div>
      </div>
      <span id="dockDur">0:00</span>
    </div>
  </div>
  <div class="dock__controls">
    <button id="btnSeekBack" title="Back 10s">«</button>
    <button id="btnPause" title="Play / Pause">❚❚</button>
    <button id="btnSeekFwd" title="Forward 10s">»</button>
    <button id="btnStop" class="btnStop" title="Stop">■</button>
  </div>
</div>

<script>
// ---- generated placeholder posters (no external images / network needed) ----
const CATEGORY_COLORS = {
  "Onboarding": ["#2c3e88", "#161d3f"],
  "Company meetings": ["#7c3aed", "#2e1065"],
  "Engineering": ["#0891b2", "#0c3b47"],
};
const FALLBACK_COLORS = [["#c2410c", "#431407"], ["#be185d", "#500724"], ["#15803d", "#0d2818"]];

function placeholderThumb(item) {
  const [c1, c2] = CATEGORY_COLORS[item.category]
    || FALLBACK_COLORS[Math.abs(hashStr(item.id)) % FALLBACK_COLORS.length];
  const initials = item.title
    .split(" ")
    .filter(Boolean)
    .slice(0, 2)
    .map((w) => w[0].toUpperCase())
    .join("");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${c1}"/>
        <stop offset="100%" stop-color="${c2}"/>
      </linearGradient>
    </defs>
    <rect width="440" height="660" fill="url(#g)"/>
    <circle cx="220" cy="300" r="150" fill="#ffffff" opacity="0.06"/>
    <text x="220" y="330" font-family="-apple-system, Helvetica, sans-serif" font-size="120"
          font-weight="700" fill="#ffffff" fill-opacity="0.22" text-anchor="middle"
          dominant-baseline="middle">${initials}</text>
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return h;
}

// ---- mock data standing in for the Pi's /api/media + /api/continue-watching ----
const MOCK_MEDIA = [
  { id: "e1", title: "Onboarding welcome", category: "Onboarding", duration: 320 },
  { id: "e2", title: "IT security basics", category: "Onboarding", duration: 540 },
  { id: "e3", title: "Benefits overview", category: "Onboarding", duration: 480 },
  { id: "c1", title: "Q3 all-hands", category: "Company meetings", duration: 2760 },
  { id: "c2", title: "Product roadmap review", category: "Company meetings", duration: 1980 },
  { id: "c3", title: "Town hall — March", category: "Company meetings", duration: 3120 },
  { id: "t1", title: "Design system intro", category: "Engineering", duration: 900 },
  { id: "t2", title: "API guidelines", category: "Engineering", duration: 660 },
  { id: "t3", title: "Incident response walkthrough", category: "Engineering", duration: 1140 },
];
for (const item of MOCK_MEDIA) item.thumbnail = placeholderThumb(item);

const MOCK_PROGRESS = {
  c2: { position: 900, duration: 1980 },
  t1: { position: 720, duration: 900 },
};
for (const item of MOCK_MEDIA) {
  if (MOCK_PROGRESS[item.id]) item.progress = MOCK_PROGRESS[item.id];
}

const grid = document.getElementById("categoryRows");
const continueRow = document.getElementById("continueRow");
const continueGrid = document.getElementById("continueGrid");
const dock = document.getElementById("dock");
const dockTitle = document.getElementById("dockTitle");
const dockNdiBadge = document.getElementById("dockNdiBadge");
const dockPos = document.getElementById("dockPos");
const dockDur = document.getElementById("dockDur");
const dockBar = document.getElementById("dockBar");
const dockBarFill = document.getElementById("dockBarFill");
const dockBarHandle = document.getElementById("dockBarHandle");
const btnPause = document.getElementById("btnPause");
const rescanBtn = document.getElementById("rescanBtn");
const outputHdmiBtn = document.getElementById("outputHdmiBtn");
const outputNdiBtn = document.getElementById("outputNdiBtn");

function fmtTime(s) {
  if (s == null || isNaN(s)) return "0:00";
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60);
  const sec = String(s % 60).padStart(2, "0");
  return `${m}:${sec}`;
}

function buildCard(item, { badge, showRestart } = {}) {
  const card = document.createElement("div");
  card.className = "card";
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.setAttribute("aria-label", `Play ${item.title}`);

  const thumbWrap = document.createElement("div");
  thumbWrap.className = "card__frame";
  const img = document.createElement("img");
  img.className = "card__thumb";
  img.src = item.thumbnail;
  img.alt = "";
  img.loading = "lazy";
  thumbWrap.appendChild(img);

  const scrim = document.createElement("div");
  scrim.className = "card__scrim";
  thumbWrap.appendChild(scrim);

  const playGlyph = document.createElement("div");
  playGlyph.className = "card__play";
  playGlyph.textContent = "▶";
  thumbWrap.appendChild(playGlyph);

  if (badge) {
    const b = document.createElement("div");
    b.className = "card__resume-badge";
    b.textContent = badge;
    thumbWrap.appendChild(b);
  }

  if (showRestart) {
    const r = document.createElement("button");
    r.className = "card__restart";
    r.title = "Start over from the beginning";
    r.textContent = "↺";
    r.addEventListener("click", (e) => {
      e.stopPropagation();
      playItem(item, { restart: true });
    });
    thumbWrap.appendChild(r);
  }

  if (item.progress && item.progress.duration) {
    const bar = document.createElement("div");
    bar.className = "card__progress";
    const fill = document.createElement("div");
    fill.className = "card__progress-fill";
    fill.style.width = `${Math.min(100, (item.progress.position / item.progress.duration) * 100)}%`;
    bar.appendChild(fill);
    thumbWrap.appendChild(bar);
  }

  const title = document.createElement("div");
  title.className = "card__title";
  title.textContent = item.title;
  thumbWrap.appendChild(title);

  card.appendChild(thumbWrap);
  card.addEventListener("click", () => playItem(item));
  card.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playItem(item); }
  });
  return card;
}

function wrapScroller(scroller) {
  const viewport = document.createElement("div");
  viewport.className = "row__viewport";
  scroller.parentNode.insertBefore(viewport, scroller);
  viewport.appendChild(scroller);

  const leftBtn = document.createElement("button");
  leftBtn.className = "row__arrow row__arrow--left hidden";
  leftBtn.setAttribute("aria-label", "Scroll left");
  leftBtn.textContent = "‹";

  const rightBtn = document.createElement("button");
  rightBtn.className = "row__arrow row__arrow--right hidden";
  rightBtn.setAttribute("aria-label", "Scroll right");
  rightBtn.textContent = "›";

  viewport.insertBefore(leftBtn, scroller);
  viewport.appendChild(rightBtn);

  function update() {
    const max = scroller.scrollWidth - scroller.clientWidth;
    leftBtn.classList.toggle("hidden", scroller.scrollLeft <= 4);
    rightBtn.classList.toggle("hidden", max <= 4 || scroller.scrollLeft >= max - 4);
  }

  leftBtn.addEventListener("click", () => {
    scroller.scrollBy({ left: -scroller.clientWidth * 0.9, behavior: "smooth" });
  });
  rightBtn.addEventListener("click", () => {
    scroller.scrollBy({ left: scroller.clientWidth * 0.9, behavior: "smooth" });
  });
  scroller.addEventListener("scroll", update);
  window.addEventListener("resize", update);
  update();

  return update;
}

const continueScrollUpdate = wrapScroller(continueGrid);

function renderCategories(items) {
  grid.innerHTML = "";
  const byCategory = new Map();
  for (const item of items) {
    const cat = item.category || "Uncategorized";
    if (!byCategory.has(cat)) byCategory.set(cat, []);
    byCategory.get(cat).push(item);
  }
  for (const name of [...byCategory.keys()]) {
    const section = document.createElement("section");
    section.className = "row";
    const heading = document.createElement("h2");
    heading.className = "row__heading";
    heading.textContent = name;
    section.appendChild(heading);
    const scroller = document.createElement("div");
    scroller.className = "row__scroller";
    for (const item of byCategory.get(name)) scroller.appendChild(buildCard(item));
    section.appendChild(scroller);
    wrapScroller(scroller);
    grid.appendChild(section);
  }
}

function renderContinueRow(items) {
  const withProgress = items.filter((i) => i.progress);
  continueGrid.innerHTML = "";
  continueRow.classList.toggle("hidden", withProgress.length === 0);
  for (const item of withProgress) {
    const remaining = item.progress.duration - item.progress.position;
    const badge = remaining > 60 ? `${fmtTime(remaining)} left` : "Almost done";
    continueGrid.appendChild(buildCard(item, { badge, showRestart: true }));
  }
  continueScrollUpdate();
}

// ---- mock output mode (stands in for GET/POST /api/output_mode) ----
let outputMode = "hdmi";

function paintOutputToggle() {
  outputHdmiBtn.classList.toggle("active", outputMode === "hdmi");
  outputNdiBtn.classList.toggle("active", outputMode === "ndi");
}

function switchOutputMode(mode) {
  if (mode === outputMode) return;
  const somethingPlaying = !dock.classList.contains("hidden");
  if (somethingPlaying) {
    const ok = confirm(`Switching to ${mode.toUpperCase()} output will stop what's currently playing. Continue?`);
    if (!ok) return;
  }
  outputMode = mode;
  paintOutputToggle();
  stopPlayback();
}

outputHdmiBtn.addEventListener("click", () => switchOutputMode("hdmi"));
outputNdiBtn.addEventListener("click", () => switchOutputMode("ndi"));

// ---- mock playback state (stands in for mpv/ffmpeg + the Flask API) ----
let playState = null;
let tickTimer = null;

function playItem(item, { restart = false } = {}) {
  const startPos = restart ? 0 : (item.progress ? item.progress.position : 0);
  playState = { item, position: startPos, duration: item.duration, paused: false };
  dockTitle.textContent = item.title;
  dockNdiBadge.classList.toggle("hidden", outputMode !== "ndi");
  dock.classList.remove("hidden");
  setPauseIcon(false);
  paintDock();
  clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    if (!playState || playState.paused) return;
    playState.position = Math.min(playState.duration, playState.position + 1);
    paintDock();
    if (playState.position >= playState.duration) stopPlayback();
  }, 1000);
}

function paintDock() {
  if (!playState) return;
  dockPos.textContent = fmtTime(playState.position);
  dockDur.textContent = fmtTime(playState.duration);
  const frac = playState.duration ? playState.position / playState.duration : 0;
  dockBarFill.style.width = `${frac * 100}%`;
  dockBarHandle.style.left = `${frac * 100}%`;
}

function setPauseIcon(paused) { btnPause.textContent = paused ? "▶" : "❚❚"; }

function stopPlayback() {
  clearInterval(tickTimer);
  playState = null;
  dock.classList.add("hidden");
}

btnPause.addEventListener("click", () => {
  if (!playState) return;
  playState.paused = !playState.paused;
  setPauseIcon(playState.paused);
});
document.getElementById("btnSeekBack").addEventListener("click", () => {
  if (!playState) return;
  playState.position = Math.max(0, playState.position - 10);
  paintDock();
});
document.getElementById("btnSeekFwd").addEventListener("click", () => {
  if (!playState) return;
  playState.position = Math.min(playState.duration, playState.position + 10);
  paintDock();
});
document.getElementById("btnStop").addEventListener("click", stopPlayback);

let scrubbing = false;
function fracFromEvent(e) {
  const rect = dockBar.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  return Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
}
dockBar.addEventListener("mousedown", (e) => {
  if (!playState) return;
  scrubbing = true;
  const frac = fracFromEvent(e);
  dockBarFill.style.width = `${frac * 100}%`;
  dockBarHandle.style.left = `${frac * 100}%`;
  dockPos.textContent = fmtTime(playState.duration * frac);
});
window.addEventListener("mousemove", (e) => {
  if (!scrubbing || !playState) return;
  const frac = fracFromEvent(e);
  dockBarFill.style.width = `${frac * 100}%`;
  dockBarHandle.style.left = `${frac * 100}%`;
  dockPos.textContent = fmtTime(playState.duration * frac);
});
window.addEventListener("mouseup", (e) => {
  if (!scrubbing || !playState) return;
  scrubbing = false;
  playState.position = playState.duration * fracFromEvent(e);
  paintDock();
});

rescanBtn.addEventListener("click", () => {
  rescanBtn.textContent = "Scanning…";
  setTimeout(() => { rescanBtn.textContent = "Rescan"; }, 500);
});

paintOutputToggle();
renderCategories(MOCK_MEDIA);
renderContinueRow(MOCK_MEDIA);
</script>
</body>
</html>
